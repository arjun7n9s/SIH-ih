[project]
name = "suchna"
version = "0.1.0"
description = "Suchna — multilingual, contradiction-aware knowledge assistant for IIITDM Jabalpur"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "curl_cffi>=0.7.0",
  "openai>=1.50.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
