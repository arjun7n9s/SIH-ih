seed_contradictions:
  - claim: Fee refund on withdrawal
    doc_a: refund-2023
    doc_b: faq-2025
    note: Notification has rupee slabs; FAQ says contact JoSAA/CSAB.
  - claim: Which academic rules bind current UG students
    doc_a: ug-guidelines-2025
    doc_b: ug-pg-guidelines-2017
    note: 2025 text says it supersedes earlier guidelines; 2017 still published.
  - claim: Hostel / mess charges
    doc_a: fee-ug-2024
    doc_b: fee-phd-2025
    note: Mess advance 15000 vs 20000; use as freshness, not a true conflict, unless hostel fee line differs.
